[project]
name = "receipt-pal-api"
version = "0.1.0"
description = "Receipt Pal API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28.1",
    "json5>=0.15.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.fastapi]
entrypoint = "app.main:app"
